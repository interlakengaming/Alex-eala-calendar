name: Sync Alex Eala Calendar

on:
  schedule:
    - cron: '0 */4 * * *' # Automatically updates every 4 hours
  workflow_dispatch:

permissions:
  contents: write

env:
  ACTIONS_ALLOW_USE_UNSECURE_NODE20: true

jobs:
  run-sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set Up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: pip install icalendar pytz

      - name: Run Scraper
        run: python eala_cal.py

      - name: Push to Repo
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add alex_eala.ics
          git commit -m "Auto-update match schedule" || exit 0
          git push
